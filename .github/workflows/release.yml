name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Release, win-x64, Native AOT)
        shell: pwsh
        run: ./build/publish.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer\VibesboxKiosk.iss

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME installer\Output\*.exe --title $env:GITHUB_REF_NAME --generate-notes
